<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Financial Statement Agent</title>
<style>
  /* Same tokens as index.html, so the two pages are recognisably one app. */
  :root{
    --bg:#f6f7f9; --panel:#fff; --panel-2:#fbfcfd; --ink:#12161c; --muted:#5c6675;
    --line:#e3e7ec; --accent:#2f6feb; --accent-ink:#fff;
    --ok:#127a4b; --ok-bg:#e6f5ed; --warn:#8a5a00; --warn-bg:#fdf3e0;
    --err:#b3261e; --err-bg:#fdeceb; --radius:10px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1216; --panel:#161b22; --panel-2:#1b2129; --ink:#e7ebf0; --muted:#9aa5b3;
      --line:#2a323c; --accent:#4c8dff; --accent-ink:#0b0e12;
      --ok:#5ddc9c; --ok-bg:#12291f; --warn:#e8b45a; --warn-bg:#2a2114;
      --err:#ff8a80; --err-bg:#2d1614;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1216; --panel:#161b22; --panel-2:#1b2129; --ink:#e7ebf0; --muted:#9aa5b3;
    --line:#2a323c; --accent:#4c8dff; --accent-ink:#0b0e12;
    --ok:#5ddc9c; --ok-bg:#12291f; --warn:#e8b45a; --warn-bg:#2a2114;
    --err:#ff8a80; --err-bg:#2d1614;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
    display:grid;place-items:center;padding:24px;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px;width:100%;max-width:392px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .tagline{color:var(--muted);font-size:13px;margin:5px 0 20px}

  /* One column, labels above fields, so every control shares a left edge. */
  form{display:grid;gap:14px}
  label{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
  input{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:inherit;width:100%}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button{font:inherit;font-size:14px;padding:10px 15px;border-radius:8px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}

  .msg{font-size:13px;padding:9px 11px;border-radius:7px;background:var(--err-bg);
    color:var(--err)}
  .msg[hidden]{display:none}
  .note{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px}
  .note b{color:var(--warn)}
</style>
</head>
<body>
  <main class="card">
    <h1>Financial Statement Agent</h1>
    <div class="tagline">Sign in to extract and reconcile documents.</div>

    <form id="f">
      <!-- The name is recorded against every fix approved in this session, which is the
           whole reason this page exists. -->
      <label for="name">Your name
        <input id="name" name="name" autocomplete="name" required maxlength="80"
               placeholder="e.g. Priya Nair">
      </label>
      <label for="code">Access code
        <input id="code" name="access_code" type="password" autocomplete="current-password"
               required placeholder="shared with your team">
      </label>
      <div class="msg" id="msg" role="alert" hidden></div>
      <button type="submit" id="go">Sign in</button>
    </form>

    <div class="note">
      Your name is recorded against every fix you approve or withdraw. This is a shared
      access code, not an individual login &mdash; <b>do not put client documents through
      this build.</b>
    </div>
  </main>

<script>
const form = document.querySelector('#f');
const msg = document.querySelector('#msg');
const go = document.querySelector('#go');

// Where to land after signing in. Only a same-site path is honoured, so ?next= cannot
// be used to bounce someone to another site off the back of this form.
function nextPath(){
  const raw = new URLSearchParams(location.search).get('next') || '/';
  return /^\/(?!\/)/.test(raw) ? raw : '/';
}

form.addEventListener('submit', async ev => {
  ev.preventDefault();
  msg.hidden = true;
  go.disabled = true; go.textContent = 'Signing in…';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name: form.name.value,
        access_code: form.access_code.value,
      }),
    });
    if (!res.ok){
      let detail = await res.text();
      try { detail = JSON.parse(detail).detail || detail; } catch {}
      throw new Error(detail);
    }
    location.href = nextPath();
  } catch (err){
    msg.textContent = err.message || String(err);
    msg.hidden = false;
    go.disabled = false; go.textContent = 'Sign in';
    form.access_code.focus();
    form.access_code.select();
  }
});
</script>
</body>
</html>
